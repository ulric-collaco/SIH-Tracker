name: Scrape SIH 2026 Problem Statements

on:
  schedule:
    # Targets 12:00 AM, 06:00 AM, 12:00 PM, 06:00 PM IST (offset to :15 UTC to bypass peak runner queue spikes)
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: npm run scrape

      - name: Sync Public Data
        run: node scripts/sync-public-data.js

      - name: Commit and Push if Data Changed
        run: |
          # Use repository owner identity so Vercel treats commits as owner authored
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          
          # Check if data or public/data has modifications or untracked files
          if [ -n "$(git status --porcelain data/ public/data/)" ]; then
            echo "Data changes detected. Committing..."
            git add data/ public/data/
            # Do NOT use [skip ci], so Vercel auto-deploys on commit
            git commit -m "chore(data): auto-update SIH 2026 problem statements"
            git push origin main
          else
            echo "No data changes since last scrape. Skipping commit."
          fi

      - name: Trigger Vercel Deploy Hook (if configured)
        if: env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Triggering Vercel Deploy Hook..."
          curl -s -X POST "$VERCEL_DEPLOY_HOOK"
