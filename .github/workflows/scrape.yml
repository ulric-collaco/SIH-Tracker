name: Scrape SIH 2026 Problem Statements

on:
  schedule:
    # Runs every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC (05:30, 11:30, 17:30, 23:30 IST)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        run: npm run scrape

      - name: Sync Public Data
        run: node scripts/sync-public-data.js

      - name: Commit and Push if Data Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if data or public/data has modifications or untracked files
          if [ -n "$(git status --porcelain data/ public/data/)" ]; then
            echo "Data changes detected. Committing..."
            git add data/ public/data/
            git commit -m "chore(data): auto-update SIH 2026 problem statements [skip ci]"
            git push origin main
          else
            echo "No data changes since last scrape. Skipping commit."
          fi
