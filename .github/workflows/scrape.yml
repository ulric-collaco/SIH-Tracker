name: Scrape SIH 2026 Problem Statements

on:
  schedule:
    # Trigger every 3 hours. With concurrency queueing, a fresh runner seamlessly takes over.
    - cron: '10 */3 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git Author
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"

      - name: Run 30-Minute Continuous Scraper Loop
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPE_CUTOFF_DATE: ${{ vars.SCRAPE_CUTOFF_DATE || '2026-09-20T23:59:59+05:30' }}
        run: npm run scrape:loop

      - name: Trigger Vercel Deploy Hook (if configured)
        if: always() && env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Triggering Vercel Deploy Hook..."
          curl -s -X POST "$VERCEL_DEPLOY_HOOK"

